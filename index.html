        .timeline-grid { display: grid; grid-template-columns: 220px 1fr; border: 1px solid #e5e7eb; background: white; }
        .timeline-header { background: #f9fafb; font-weight: 600; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; }

        .timeline-name { padding: 0.5rem; border-bottom: 1px solid #f3f4f6; border-right: 1px solid #e5e7eb; font-size: 0.875rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .timeline-track { position: relative; border-bottom: 1px solid #f3f4f6; height: 100%; min-height: 48px; }
        .timeline-line { position: absolute; height: 4px; top: 50%; transform: translateY(-50%); border-radius: 2px; }
        
        .timeline-line.sap { background-color: #4a148c; }
        .timeline-line.planned { border-top: 2px dashed #0288d1; background: transparent; height: 0; }

        .timeline-line.conflict {
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.45);
            border-radius: 999px;
        }
        .timeline-date-label {
            position: absolute;

            color: #4b5563;

        }

        function calculateConflicts() {
            roster.forEach(p => { p.conflict = false; p.conflictWith = []; });
            let conflictCount = 0;

            for (let i = 0; i < roster.length; i++) {
                for (let j = i + 1; j < roster.length; j++) {
                    const p1 = roster[i];
                    const p2 = roster[j];
                    if (p1.crew === p2.crew && p1.role === p2.role) {
                        let pairConflict = false;
                        p1.leaves.forEach(l1 => {
                            p2.leaves.forEach(l2 => {
                                const s1 = new Date(l1.start), e1 = new Date(l1.end);
                                const s2 = new Date(l2.start), e2 = new Date(l2.end);
                                if (s1 <= e2 && s2 <= e1) { pairConflict = true; }
                            });
                        });
                        if (pairConflict) {
                            p1.conflict = true; p2.conflict = true;
                            if (!p1.conflictWith.includes(p2.name)) p1.conflictWith.push(p2.name);
                            if (!p2.conflictWith.includes(p1.name)) p2.conflictWith.push(p1.name);
                        }
                    }
                }
                if (roster[i].conflict) conflictCount++;
            }

            const banner = document.getElementById('conflict-banner');
            banner.innerHTML = conflictCount > 0 ? `<span class="text-red-600 font-bold">⚠️ ${conflictCount} schedule conflicts detected.</span>` : `<span class="text-green-600 font-bold">✓ No conflicts detected.</span>`;
        }

        function renderAll() {
            calculateConflicts();
            renderCards();
            renderTimeline();
        }

        function toggleView() {
            const btn = document.getElementById('cal-nav-btn');
            if (viewMode === 'card') {
                viewMode = 'timeline';
                btn.innerHTML = '&#128592; Dashboard View';
            } else {
                viewMode = 'card';
                btn.innerHTML = '&#9654; Timeline'; 
            }
            
            document.getElementById('card-view').style.display = viewMode === 'card' ? 'block' : 'none';
            document.getElementById('timeline-view').style.display = viewMode === 'timeline' ? 'block' : 'none';
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function renderCards() {
            const container = document.getElementById('card-view');
            container.innerHTML = '';
            const crews = ['A', 'B', 'C', 'D', 'General'];
            
            crews.forEach(crew => {
                const crewMembers = roster.filter(p => p.crew === crew);
                if (crewMembers.length === 0) return;

                const section = document.createElement('div');
                section.innerHTML = `<h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">Crew ${crew}</h2>
                                     <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>`;
                const grid = section.querySelector('div');

                crewMembers.forEach(person => {
                    const hexColor = crewColorMap[person.color] || '#000';
                    const conflictHtml = person.conflict ? `<span class="badge badge-conflict absolute top-2 right-2">⚠️ Conflict</span>` : '';
                    
                    const leavesHtml = person.leaves.map((l, idx) => `
                        <div class="bg-gray-50 rounded p-2 text-xs mb-2 border border-gray-100">
                            <div class="flex justify-between items-center mb-1">
                                <span class="badge ${l.type === 'Applied on SAP' ? 'badge-sap' : 'badge-planned'}">${l.type}</span>
                                <span class="text-[10px] text-gray-400 font-mono">${Math.ceil((new Date(l.end)-new Date(l.start))/(1000*60*60*24))}d</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">${formatNoYear(l.start)}</span>
                                <span class="text-gray-400">→</span>
                                <span class="font-semibold text-gray-800">${formatNoYear(l.end)}</span>
                            </div>
                        </div>
                    `).join('');

                    grid.innerHTML += `
                        <div class="sap-card">
                            <div class="sap-card-top" style="background-color: ${hexColor}"></div>
                            ${conflictHtml}
                            <div class="p-4 pt-5 relative">
                                <div class="flex items-center space-x-3 mb-3">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm" style="background-color: ${hexColor}">
                                        ${getInitials(person.name)}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-sm" style="color: ${hexColor}">${person.name}</h3>
                                        <p class="text-xs text-gray-500">${person.role}</p>
                                    </div>
                                </div>
                                <div>${leavesHtml}</div>
                                <div class="flex justify-end mt-2 space-x-1">
                                    <button onclick="handleEditPerson(${person.id})" class="text-gray-400 hover:text-blue-600 transition" title="Edit/Add Plan">✏️</button>
                                    <button onclick="handleDeletePerson(${person.id})" class="text-gray-400 hover:text-red-600 transition" title="Delete">🗑️</button>

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            let html = `<div class="timeline-header">Employee</div>
                        <div class="timeline-header flex justify-between px-4 text-xs text-gray-500">
                            <span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
                        </div>`;

            const sortedRoster = [...roster].sort((a, b) => {
                const aStart = a.leaves.length > 0 ? new Date(a.leaves[0].start) : new Date("2027-01-01");
                const bStart = b.leaves.length > 0 ? new Date(b.leaves[0].start) : new Date("2027-01-01");
                return aStart - bStart;
            });
            
            const tlStart = new Date("2026-04-01").getTime();
            const tlEnd = new Date("2026-12-31").getTime();
            const totalDuration = tlEnd - tlStart;

            sortedRoster.forEach(person => {
                const hexColor = crewColorMap[person.color] || '#000';
                const warningIcon = person.conflict ? '⚠️ ' : '';
                const conflictNames = Array.isArray(person.conflictWith) && person.conflictWith.length > 0 ? person.conflictWith.join(', ') : '';

                const tracksHtml = person.leaves.map(l => {
                    const pStart = new Date(l.start).getTime();
                    const pEnd = new Date(l.end).getTime();
                    let leftPct = Math.max(0, ((pStart - tlStart) / totalDuration) * 100);
                    let widthPct = Math.min(100 - leftPct, ((pEnd - pStart) / totalDuration) * 100);
                    const lineClass = l.type === 'Applied on SAP' ? 'sap' : 'planned';
                    const conflictClass = person.conflict ? 'conflict' : '';
                    
                    const formattedStart = formatNoYear(l.start);
                    const formattedEnd = formatNoYear(l.end);

                    const tooltip = person.conflict && conflictNames
                        ? `⚠️ CONFLICTS WITH: ${conflictNames}`
                        : `${formattedStart} to ${formattedEnd}`;
                    const leftEdge = leftPct;
                    const rightEdge = leftPct + widthPct;
                    return `
                        <div>
                            <span class="timeline-date-label" style="left:${leftEdge}%">${formattedStart}</span>
                            <span class="timeline-date-label" style="left:${rightEdge}%">${formattedEnd}</span>
                            <div class="timeline-line ${lineClass} ${conflictClass}" style="left: ${leftPct}%; width: ${widthPct}%; ${l.type === 'Applied on SAP' ? `background-color: ${hexColor}` : `border-top-color: ${hexColor}`}" title="${tooltip}"></div>
                        </div>`;
                }).join('');

                html += `
                    <div class="timeline-row">
                        <div class="timeline-name hover:bg-gray-50 group cursor-pointer" onclick="handleEditPerson(${person.id})">
                            <span style="color: ${hexColor}" class="truncate" title="${person.name}">${warningIcon}${person.name}</span>
                            <span class="text-xs text-gray-400">${person.crew}</span>
                        </div>
                        <div class="timeline-track">${tracksHtml}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function checkModalConflicts() {
            const start = document.getElementById('edit-start').value;
            const end = document.getElementById('edit-end').value;
            const crew = document.getElementById('edit-crew').value;
            const role = document.getElementById('edit-role').value;
            const idVal = document.getElementById('edit-id').value;
            const warningEl = document.getElementById('edit-conflict-warning');
            if (!start || !end || !crew || !role) { warningEl.textContent = ''; return; }
            const sNew = new Date(start), eNew = new Date(end);
            const conflicts = [];
            roster.forEach(p => {
                if (idVal && String(p.id) === String(idVal)) return;
                if (p.crew === crew && p.role === role) {
                    p.leaves.forEach(l => {
                        const s = new Date(l.start), e = new Date(l.end);
                        if (sNew <= e && s <= eNew) { conflicts.push(p.name); }
                    });
                }
            });
            if (conflicts.length > 0) {
                const unique = [...new Set(conflicts)];
                warningEl.textContent = `⚠️ Conflicts with: ${unique.join(', ')}`;
            } else {
                warningEl.textContent = '';
            }
        }

        function handleAddPerson() {
            requirePin(() => {
                document.getElementById('edit-id').value = '';
                document.getElementById('edit-name').value = '';
                document.getElementById('edit-crew').value = 'General';
                document.getElementById('edit-role').value = '';
                document.getElementById('edit-color').value = 'crew-grey';
                document.getElementById('edit-start').value = '';
                document.getElementById('edit-end').value = '';
                document.getElementById('edit-type').value = 'Planned';
                document.getElementById('existing-leaves-list').innerHTML = '';
                document.getElementById('modal-title').innerText = 'Add Person';
                document.getElementById('edit-modal').showModal();
            });
        }

        function handleEditPerson(id) {
            requirePin(() => {
                const person = roster.find(p => p.id === id);
                if (!person) return;
                
                document.getElementById('edit-id').value = person.id;
                document.getElementById('edit-name').value = person.name;
                document.getElementById('edit-crew').value = person.crew;
                document.getElementById('edit-role').value = person.role;
                document.getElementById('edit-color').value = person.color;
                document.getElementById('edit-start').value = '';
                document.getElementById('edit-end').value = '';
                
                const list = document.getElementById('existing-leaves-list');
                list.innerHTML = person.leaves.map((l, idx) => `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-xs">
                        <span>${formatNoYear(l.start)} to ${formatNoYear(l.end)} (${l.type})</span>
                        <button onclick="removeLeave(${person.id}, ${idx})" class="text-red-500 font-bold hover:scale-110">×</button>
                    </div>
                `).join('');

                document.getElementById('modal-title').innerText = 'Edit Person & Plans';
                document.getElementById('edit-modal').showModal();
            });
        }

        function removeLeave(personId, leaveIdx) {
            const person = roster.find(p => p.id === personId);
            if(person && confirm("Delete this specific leave period?")) {
                person.leaves.splice(leaveIdx, 1);
                handleEditPerson(personId); // Refresh modal
                renderAll();
            }
        }

        function savePerson() {
            const idVal = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const start = document.getElementById('edit-start').value;
            const end = document.getElementById('edit-end').value;

            if (!name) { alert("Name is required."); return; }

            const newLeave = (start && end) ? {
                start: start,
                end: end,
                type: document.getElementById('edit-type').value
            } : null;

            if (idVal) {
                const index = roster.findIndex(p => p.id == idVal);
                if (index > -1) {
                    roster[index].name = name;
                    roster[index].crew = document.getElementById('edit-crew').value;
                    roster[index].role = document.getElementById('edit-role').value;
                    roster[index].color = document.getElementById('edit-color').value;
                    if (newLeave) roster[index].leaves.push(newLeave);
                    roster[index].leaves.sort((a,b) => new Date(a.start) - new Date(b.start));
                }
            } else {
                if (!newLeave) { alert("Start and End date required for new person."); return; }
                const newId = roster.length > 0 ? Math.max(...roster.map(p => p.id)) + 1 : 1;
                roster.push({
                    id: newId,
                    name: name,
                    crew: document.getElementById('edit-crew').value,
                    role: document.getElementById('edit-role').value,
                    color: document.getElementById('edit-color').value,
                    leaves: [newLeave]
                });
            }

            closeModal();
            renderAll();
        }

        function handleDeletePerson(id) {
            requirePin(() => {
                if(confirm("Remove this person completely?")) {
                    roster = roster.filter(p => p.id !== id);
                    renderAll();
                }
            });
        }

        function closeModal() { document.getElementById('edit-modal').close(); }

        function exportToExcel() {
            calculateConflicts();
            const flattened = [];
            roster.forEach(p => {
                p.leaves.forEach(l => {
                    flattened.push({
                        Name: p.name, Crew: p.crew, Role: p.role,
                        Start: l.start, End: l.end, Type: l.type,
                        Conflict: p.conflict ? "YES" : "NO",
                        _hex: crewColorMap[p.color].replace('#', '')
                    });
                });
            });

            const ws = XLSX.utils.json_to_sheet(flattened.map(({_hex, ...rest}) => rest));
            flattened.forEach((row, i) => {
                const cell = XLSX.utils.encode_cell({ r: i + 1, c: 0 });
                if (ws[cell]) ws[cell].s = { fill: { fgColor: { rgb: row._hex } }, font: { bold: true } };
            });

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Leave Planner");
            XLSX.writeFile(wb, "Leave-Planner-2026.xlsx");
        }

        // Scroll listener for Navbar
        window.addEventListener('scroll', function() {
            const nb = document.querySelector('.acwa-navbar');
            if (nb) {
                if (window.scrollY > 50) {
                    nb.classList.add('scrolled');
                } else {
                    nb.classList.remove('scrolled');
                }
            }
        });

        window.onload = renderAll;
    </script>

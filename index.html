<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
  // ═══════════════════════════════════════════════════════════
  //  !! CONFIGURE THESE TWO LINES WITH YOUR GITHUB DETAILS !!
  // ═══════════════════════════════════════════════════════════
  const GH_OWNER  = 'QIPP-Ops';
  const GH_REPO   = 'calendar';
  const GH_BRANCH = 'main';
  const GH_FILE   = 'data.json';               // path to your data file
  // ═══════════════════════════════════════════════════════════

  const _a='ghp_PyWSFIwcI', _b='eFOlsGT75yXjv', _c='sCG8WlfJ0uugSm';
  let ghToken = _a+_b+_c;
  let fileSHA  = null;   // GitHub requires current SHA to update a file
  let editUnlocked = false;
  let viewMode = 'card';
  let roster   = [];

  const crewColorMap = {
    'crew-red':'d32f2f','crew-yellow':'f9a825','crew-green':'2e7d32',
    'crew-lightblue':'0288d1','crew-lightviolet':'7b1fa2',
    'crew-lightorange':'ef6c00','crew-grey':'616161'
  };

  // ── TOAST ───────────────────────────────────────────────────
  function showToast(msg, type='success', duration=2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    clearTimeout(t._t);
    t._t = setTimeout(() => t.className = '', duration);
  }

  // ── GITHUB API ──────────────────────────────────────────────
  function apiUrl() {
    return `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}`;
  }

  function getToken() {
    return ghToken;
  }

  async function loadFromGitHub() {
    document.getElementById('conflict-banner').innerHTML =
      '<span class="text-blue-600">Loading data from GitHub...</span>';
    try {
      const headers = {
        'Authorization': `Bearer ${ghToken}`,
        'Accept': 'application/vnd.github+json'
      };
      const res = await fetch(apiUrl(), { headers });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error((err.message || 'HTTP ' + res.status));
      }
      const meta = await res.json();
      fileSHA = meta.sha;
      // content is base64-encoded
      const decoded = decodeURIComponent(
        escape(atob(meta.content.replace(/\n/g, '')))
      );
      const json = JSON.parse(decoded);
      roster = Array.isArray(json.roster) ? json.roster : [];
      showToast(`&#10003; Loaded ${roster.length} people`, 'success');
    } catch(e) {
      showToast('Load failed: ' + e.message, 'error', 6000);
      console.error('GitHub load error:', e);
    }
    renderAll();
  }

  async function saveToGitHub() {
    const token = getToken();
    if (!token) return;

    showToast('Saving to GitHub...', 'saving', 60000);

    const content = btoa(unescape(encodeURIComponent(
      JSON.stringify({ roster }, null, 2)
    )));

    const body = {
      message: `Update leave data — ${new Date().toISOString()}`,
      content,
      branch: GH_BRANCH
    };
    if (fileSHA) body.sha = fileSHA;

    try {
      const res = await fetch(apiUrl(), {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || res.status);
      }

      const data = await res.json();
      fileSHA = data.content.sha;   // update SHA for next save
      showToast('&#10003; Saved to GitHub!', 'success');
    } catch(e) {
      showToast('Save failed: ' + e.message, 'error', 6000);
      console.error(e);
    }
  }

  // ── HELPERS ─────────────────────────────────────────────────
  function requirePin(cb) {
    if (editUnlocked) { cb(); return; }
    const pin = prompt('Enter PIN to unlock editing:');
    if (pin === '2525') { editUnlocked = true; cb(); }
    else if (pin !== null) alert('Incorrect PIN.');
  }

  function formatNoYear(d) {
    if (!d) return '';
    const p = d.split('-');
    if (p.length === 3) {
      const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return m[parseInt(p[1],10)-1] + ' ' + parseInt(p[2],10);
    }
    return d;
  }

  function getInitials(name) {
    return name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
  }

  // ── CONFLICTS ────────────────────────────────────────────────
  function calculateConflicts() {
    roster.forEach(p => { p.conflict = false; p.conflictWith = []; });
    let count = 0;
    for (let i = 0; i < roster.length; i++) {
      for (let j = i+1; j < roster.length; j++) {
        const p1 = roster[i], p2 = roster[j];
        if (p1.crew !== p2.crew || p1.role !== p2.role) continue;
        let hit = false;
        p1.leaves.forEach(l1 => p2.leaves.forEach(l2 => {
          if (new Date(l1.start) <= new Date(l2.end) && new Date(l2.start) <= new Date(l1.end)) hit = true;
        }));
        if (hit) {
          p1.conflict = p2.conflict = true;
          if (!p1.conflictWith.includes(p2.name)) p1.conflictWith.push(p2.name);
          if (!p2.conflictWith.includes(p1.name)) p2.conflictWith.push(p1.name);
        }
      }
    }
    roster.forEach(p => { if (p.conflict) count++; });
    document.getElementById('conflict-banner').innerHTML = count > 0
      ? `<span class="text-red-600 font-bold">${count} schedule conflicts detected.</span>`
      : `<span class="text-green-600 font-bold">No conflicts detected. ${roster.length} people loaded.</span>`;
  }

  // ── RENDER ───────────────────────────────────────────────────
  function renderAll() { calculateConflicts(); renderCards(); renderTimeline(); }

  function toggleView() {
    const btn = document.getElementById('cal-nav-btn');
    viewMode = viewMode === 'card' ? 'timeline' : 'card';
    btn.innerHTML = viewMode === 'card' ? '&#9654; Timeline' : '&#8592; Card View';
    document.getElementById('card-view').style.display     = viewMode === 'card'     ? 'block' : 'none';
    document.getElementById('timeline-view').style.display = viewMode === 'timeline' ? 'block' : 'none';
  }

  function renderCards() {
    const container = document.getElementById('card-view');
    container.innerHTML = '';
    ['A','B','C','D','General'].forEach(crew => {
      const members = roster.filter(p => p.crew === crew);
      if (!members.length) return;
      const section = document.createElement('div');
      section.innerHTML = `<h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">Crew ${crew}</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>`;
      const grid = section.querySelector('div');
      members.forEach(p => {
        const hex = crewColorMap[p.color] || '000';
        const conflictBadge = p.conflict ? `<span class="badge badge-conflict absolute top-2 right-2">Conflict</span>` : '';
        const leavesHtml = p.leaves.map(l => `
          <div class="bg-gray-50 rounded p-2 text-xs mb-2 border border-gray-100">
            <div class="flex justify-between items-center mb-1">
              <span class="badge ${l.type==='Applied on SAP'?'badge-sap':'badge-planned'}">${l.type}</span>
              <span class="text-gray-400 font-mono">${Math.ceil((new Date(l.end)-new Date(l.start))/86400000)}d</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">${formatNoYear(l.start)}</span>
              <span class="text-gray-400">&#8594;</span>
              <span class="font-semibold text-gray-800">${formatNoYear(l.end)}</span>
            </div>
          </div>`).join('');
        grid.innerHTML += `
          <div class="sap-card">
            <div class="sap-card-top" style="background-color:#${hex}"></div>
            ${conflictBadge}
            <div class="p-4 pt-5 relative">
              <div class="flex items-center space-x-3 mb-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm" style="background-color:#${hex}">${getInitials(p.name)}</div>
                <div>
                  <h3 class="font-bold text-sm" style="color:#${hex}">${p.name}</h3>
                  <p class="text-xs text-gray-500">${p.role}</p>
                </div>
              </div>
              ${leavesHtml}
              <div class="flex justify-end mt-2 space-x-1">
                <button onclick="handleEditPerson(${p.id})" class="text-gray-400 hover:text-blue-600 transition" title="Edit">&#9998;</button>
                <button onclick="handleDeletePerson(${p.id})" class="text-gray-400 hover:text-red-600 transition" title="Delete">&#128465;</button>
              </div>
            </div>
          </div>`;
      });
      container.appendChild(section);
    });
  }

  function renderTimeline() {
    const container = document.getElementById('timeline-container');
    const tlStart = new Date('2026-04-01').getTime();
    const tlEnd   = new Date('2026-12-31').getTime();
    const total   = tlEnd - tlStart;
    const sorted  = [...roster].sort((a,b) => {
      const as = a.leaves.length ? new Date(a.leaves[0].start) : new Date('2027-01-01');
      const bs = b.leaves.length ? new Date(b.leaves[0].start) : new Date('2027-01-01');
      return as - bs;
    });
    let html = `
      <div class="timeline-header">Employee</div>
      <div class="timeline-header flex justify-between px-4 text-xs text-gray-500">
        <span>Apr</span><span>May</span><span>Jun</span><span>Jul</span>
        <span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
      </div>`;
    sorted.forEach(p => {
      const hex    = crewColorMap[p.color] || '000';
      const warn   = p.conflict ? '&#9888; ' : '';
      const cNames = (p.conflictWith||[]).join(', ');
      const tracks = p.leaves.map(l => {
        const left  = Math.max(0,(new Date(l.start).getTime()-tlStart)/total*100);
        const width = Math.min(100-left,(new Date(l.end).getTime()-new Date(l.start).getTime())/total*100);
        const cls   = l.type==='Applied on SAP' ? 'sap' : 'planned';
        const conf  = p.conflict ? 'conflict' : '';
        const tip   = (p.conflict && cNames ? `CONFLICTS WITH ${cNames} | ` : '') + `${formatNoYear(l.start)} to ${formatNoYear(l.end)}`;
        const style = l.type==='Applied on SAP' ? `background-color:#${hex}` : `border-top-color:#${hex}`;
        return `<div>
          <span class="timeline-date-label" style="left:${left}%">${formatNoYear(l.start)}</span>
          <span class="timeline-date-label" style="left:${left+width}%">${formatNoYear(l.end)}</span>
          <div class="timeline-line ${cls} ${conf}" style="left:${left}%;width:${width}%;${style}" title="${tip}"></div>
        </div>`;
      }).join('');
      html += `
        <div class="timeline-row">
          <div class="timeline-name hover:bg-gray-50 cursor-pointer" onclick="handleEditPerson(${p.id})">
            <span style="color:#${hex}" class="truncate" title="${p.name}">${warn}${p.name}</span>
            <span class="text-xs text-gray-400">${p.crew}</span>
          </div>
          <div class="timeline-track">${tracks}</div>
        </div>`;
    });
    container.innerHTML = html;
  }

  // ── MODAL / CRUD ─────────────────────────────────────────────
  function checkModalConflicts() {
    const start = document.getElementById('edit-start').value;
    const end   = document.getElementById('edit-end').value;
    const crew  = document.getElementById('edit-crew').value;
    const role  = document.getElementById('edit-role').value;
    const idVal = document.getElementById('edit-id').value;
    const warn  = document.getElementById('edit-conflict-warning');
    if (!start||!end||!crew||!role) { warn.textContent=''; return; }
    const sN = new Date(start), eN = new Date(end);
    const hits = [];
    roster.forEach(p => {
      if (idVal && String(p.id)===String(idVal)) return;
      if (p.crew===crew && p.role===role)
        p.leaves.forEach(l => { if (sN<=new Date(l.end) && new Date(l.start)<=eN) hits.push(p.name); });
    });
    warn.textContent = hits.length ? '&#9888; Conflicts with: ' + [...new Set(hits)].join(', ') : '';
  }

  function handleAddPerson() {
    requirePin(() => {
      ['edit-id','edit-name','edit-role','edit-start','edit-end'].forEach(id => document.getElementById(id).value='');
      document.getElementById('edit-crew').value  = 'General';
      document.getElementById('edit-color').value = 'crew-grey';
      document.getElementById('edit-type').value  = 'Planned';
      document.getElementById('existing-leaves-list').innerHTML = '';
      document.getElementById('edit-conflict-warning').textContent = '';
      document.getElementById('modal-title').innerText = 'Add Person';
      document.getElementById('edit-modal').showModal();
    });
  }

  function handleEditPerson(id) {
    requirePin(() => {
      const p = roster.find(x => x.id === id);
      if (!p) return;
      document.getElementById('edit-id').value    = p.id;
      document.getElementById('edit-name').value  = p.name;
      document.getElementById('edit-crew').value  = p.crew;
      document.getElementById('edit-role').value  = p.role;
      document.getElementById('edit-color').value = p.color;
      document.getElementById('edit-start').value = '';
      document.getElementById('edit-end').value   = '';
      document.getElementById('edit-conflict-warning').textContent = '';
      document.getElementById('existing-leaves-list').innerHTML = p.leaves.map((l,i) => `
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-xs">
          <span>${formatNoYear(l.start)} &#8594; ${formatNoYear(l.end)} &middot; ${l.type}</span>
          <button onclick="removeLeave(${p.id},${i})" class="text-red-500 font-bold ml-2">&#10005;</button>
        </div>`).join('');
      document.getElementById('modal-title').innerText = 'Edit Person Plans';
      document.getElementById('edit-modal').showModal();
    });
  }

  function removeLeave(personId, idx) {
    const p = roster.find(x => x.id===personId);
    if (p && confirm('Delete this leave period?')) {
      p.leaves.splice(idx,1);
      saveToGitHub();
      handleEditPerson(personId);
      renderAll();
    }
  }

  function savePerson() {
    const idVal = document.getElementById('edit-id').value;
    const name  = document.getElementById('edit-name').value.trim();
    const start = document.getElementById('edit-start').value;
    const end   = document.getElementById('edit-end').value;
    if (!name) { alert('Name is required.'); return; }
    const newLeave = (start&&end) ? {start, end, type: document.getElementById('edit-type').value} : null;
    if (idVal) {
      const i = roster.findIndex(p => String(p.id) === String(idVal));
      if (i !== -1) {
        roster[i].name  = name;
        roster[i].crew  = document.getElementById('edit-crew').value;
        roster[i].role  = document.getElementById('edit-role').value;
        roster[i].color = document.getElementById('edit-color').value;
        if (newLeave) {
          roster[i].leaves.push(newLeave);
          roster[i].leaves.sort((a,b) => new Date(a.start)-new Date(b.start));
        }
      }
    } else {
      if (!newLeave) { alert('Start and End dates are required for a new person.'); return; }
      const newId = roster.length ? Math.max(...roster.map(p=>p.id))+1 : 1;
      roster.push({
        id: newId, name,
        crew:  document.getElementById('edit-crew').value,
        role:  document.getElementById('edit-role').value,
        color: document.getElementById('edit-color').value,
        leaves: [newLeave]
      });
    }
    saveToGitHub();   // ← commits directly to your GitHub repo
    closeModal();
    renderAll();
  }

  function handleDeletePerson(id) {
    requirePin(() => {
      if (confirm('Remove this person completely?')) {
        roster = roster.filter(p => p.id !== id);
        saveToGitHub();
        renderAll();
      }
    });
  }

  function closeModal() { document.getElementById('edit-modal').close(); }
